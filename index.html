    <!-- Overlay roots (kept outside renderApp's containers so a re-render cannot close them) -->
    <div id="modal-root" class="hidden fixed inset-0 z-50 flex items-center justify-center p-md"></div>
    <div id="palette-root" class="hidden fixed inset-0 z-50 flex items-start justify-center p-md pt-[12vh]"></div>

    <!-- Application Script -->
    <script>
        // Storage Keys for Encrypted Data
        const SALT_KEY = 'vault_salt';
        const AUTH_KEY = 'vault_auth_token';
        const DATA_KEY = 'vault_encrypted_data';
        const KDF_KEY = 'vault_kdf_params';
        const SETTINGS_KEY = 'vault_settings';
        const AUTH_VALIDATION_STRING = 'VAULT_AUTH_VERIFIED_V1';

        // Key derivation. Vaults created before the iteration count was recorded
        // used 100k; they are re-keyed in place on the next successful unlock.
        const PBKDF2_ITERATIONS = 600000;          // OWASP guidance for PBKDF2-SHA256
        const LEGACY_PBKDF2_ITERATIONS = 100000;
        const EXPORT_FORMAT_VERSION = 2;
        const MIN_MASTER_PASSWORD_LENGTH = 8;

        // App State
        let masterKey = null; // CryptoKey object when unlocked
        let isInitialized = false;
        let isLocked = true;
        let entries = [];
        let activeCategory = 'all';
        let searchQuery = '';
        let expandedId = null;
        let editingId = null;
        let isCreating = false;
        let deleteConfirmId = null;
        let revealedState = {};
        let initWeakAccepted = false;   // second submit confirms a weak master password

        // Default Seed Data if vault is newly initialized
        const defaultSeed = [
            {
                id: 'seed-1',
                name: 'openai_key.env',
                type: 'api-key',
                value: 'sk-proj-9876543210fedcba9876543210fedcba',
                createdAt: Date.now() - 86400000 * 3,
                lastUsedAt: Date.now() - 86400000 * 3
            },
            {
                id: 'seed-2',
                name: 'system_prompt_v2.md',
                type: 'prompt',
                value: 'You are an expert AI pair programmer. Maintain high standards, write clean code, and follow user preferences strictly.',
                createdAt: Date.now() - 86400000 * 2,
                lastUsedAt: Date.now() - 86400000
            },
            {
                id: 'seed-3',
                name: 'anthropic_api.key',
                type: 'api-key',
                value: 'sk-ant-api03-abcdef1234567890abcdef1234567890',
                createdAt: Date.now() - 86400000,
                lastUsedAt: Date.now()
            }
        ];

        // --- Web Crypto API Helpers ---
        function bufferToBase64(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)));
        }

        function base64ToBuffer(b64) {
            const binStr = atob(b64);
            const bytes = new Uint8Array(binStr.length);
            for (let i = 0; i < binStr.length; i++) {
                bytes[i] = binStr.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function getKdfParams() {
            try {
                const raw = localStorage.getItem(KDF_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && Number.isFinite(parsed.iterations) && parsed.iterations > 0) {
                        return { iterations: parsed.iterations, hash: parsed.hash || 'SHA-256' };
                    }
                }
            } catch (e) { /* fall through to the pre-versioning default */ }
            return { iterations: LEGACY_PBKDF2_ITERATIONS, hash: 'SHA-256' };
        }

        function setKdfParams(params) {
            localStorage.setItem(KDF_KEY, JSON.stringify(params));
        }

        async function deriveMasterKey(password, saltUint8Array, iterations, hash) {
            const encoder = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: saltUint8Array,
                    iterations: iterations || PBKDF2_ITERATIONS,
                    hash: hash || "SHA-256"
                },
                baseKey,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptText(plaintext, cryptoKey) {
            const encoder = new TextEncoder();
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encryptedBuf = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                encoder.encode(plaintext)
            );
            return {
                ciphertext: bufferToBase64(encryptedBuf),
                iv: bufferToBase64(iv)
            };
        }

        async function decryptText(ciphertextB64, ivB64, cryptoKey) {
            const decoder = new TextDecoder();
            const ciphertextBuf = base64ToBuffer(ciphertextB64);
            const ivBuf = base64ToBuffer(ivB64);
            const decryptedBuf = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: new Uint8Array(ivBuf) },
                cryptoKey,
                ciphertextBuf
            );
            return decoder.decode(decryptedBuf);
        }

        // --- Auth & Encrypted Storage Handlers ---
        function checkInitialization() {
            const salt = localStorage.getItem(SALT_KEY);
            const authToken = localStorage.getItem(AUTH_KEY);
            isInitialized = !!(salt && authToken);
            return isInitialized;
        }

        async function saveEntries() {
            if (!masterKey || isLocked) return;
            try {
                const jsonStr = JSON.stringify(entries);
                const encryptedPayload = await encryptText(jsonStr, masterKey);
                localStorage.setItem(DATA_KEY, JSON.stringify(encryptedPayload));
            } catch (e) {
                console.error('Failed to encrypt and save entries:', e);
            }
        }

        async function loadAndDecryptEntries() {
            if (!masterKey) return;
            try {
                const storedDataStr = localStorage.getItem(DATA_KEY);
                if (storedDataStr) {
                    const payload = JSON.parse(storedDataStr);
                    const jsonStr = await decryptText(payload.ciphertext, payload.iv, masterKey);
                    entries = JSON.parse(jsonStr);
                } else {
                    entries = defaultSeed;
                    await saveEntries();
                }
            } catch (e) {
                console.error('Failed to decrypt entries:', e);
                entries = defaultSeed;
            }
        }

        // First Time Setup Submit Handler
        window.handleInitVault = async function(e) {
            e.preventDefault();
            const password = document.getElementById('init-password').value;
            const confirm = document.getElementById('init-password-confirm').value;
            const errorEl = document.getElementById('init-error');

            if (password.length < MIN_MASTER_PASSWORD_LENGTH) {
                errorEl.textContent = `Password must be at least ${MIN_MASTER_PASSWORD_LENGTH} characters long.`;
                errorEl.classList.remove('hidden');
                return;
            }

            if (password !== confirm) {
                errorEl.textContent = 'Passwords do not match.';
                errorEl.classList.remove('hidden');
                return;
            }

            // A very weak master password undoes the encryption behind it, so make
            // the user opt in a second time rather than blocking them outright.
            const strength = estimatePasswordStrength(password);
            if (strength.score <= 1 && !initWeakAccepted) {
                initWeakAccepted = true;
                errorEl.innerHTML = `That password is <span class="text-error font-bold">${strength.label}</span> &mdash; everything in the vault is only as safe as it is. Submit again to use it anyway, or pick a stronger one.`;
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            setAuthFormBusy('init-submit', true, 'Deriving key...');
            await nextPaint();

            try {
                // Generate 16-byte salt
                const saltBytes = crypto.getRandomValues(new Uint8Array(16));
                const saltB64 = bufferToBase64(saltBytes);
                localStorage.setItem(SALT_KEY, saltB64);

                // Derive key at the current iteration count and record it, so a
                // future bump can re-key existing vaults instead of locking them out.
                const key = await deriveMasterKey(password, saltBytes, PBKDF2_ITERATIONS, 'SHA-256');
                setKdfParams({ iterations: PBKDF2_ITERATIONS, hash: 'SHA-256' });

                // Encrypt auth validation token
                const authPayload = await encryptText(AUTH_VALIDATION_STRING, key);
                localStorage.setItem(AUTH_KEY, JSON.stringify(authPayload));

                masterKey = key;
                isInitialized = true;
                isLocked = false;

                // Check if legacy unencrypted entries exist, else seed
                const legacyStored = localStorage.getItem('vault_entries');
                if (legacyStored) {
                    try { entries = JSON.parse(legacyStored); } catch(err) { entries = defaultSeed; }
                    localStorage.removeItem('vault_entries');
                } else {
                    entries = defaultSeed;
                }

                await saveEntries();
                startIdleWatch();
                renderApp();
            } catch (err) {
                console.error('Setup failed:', err);
                setAuthFormBusy('init-submit', false);
                errorEl.textContent = 'Failed to initialize encryption.';
                errorEl.classList.remove('hidden');
            }
        };

        // Unlock Submit Handler
        window.handleUnlockVault = async function(e) {
            e.preventDefault();
            const password = document.getElementById('unlock-password').value;
            const errorEl = document.getElementById('unlock-error');

            try {
                const saltB64 = localStorage.getItem(SALT_KEY);
                const authStr = localStorage.getItem(AUTH_KEY);

                if (!saltB64 || !authStr) {
                    errorEl.textContent = 'Vault state corrupted. Please clear site data.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                errorEl.classList.add('hidden');
                setAuthFormBusy('unlock-submit', true, 'Deriving key...');
                await nextPaint();

                const saltBytes = new Uint8Array(base64ToBuffer(saltB64));
                const kdf = getKdfParams();
                const key = await deriveMasterKey(password, saltBytes, kdf.iterations, kdf.hash);
                const authPayload = JSON.parse(authStr);

                // Verify password by attempting decryption of validation string
                const decryptedAuth = await decryptText(authPayload.ciphertext, authPayload.iv, key);

                if (decryptedAuth === AUTH_VALIDATION_STRING) {
                    masterKey = key;
                    isLocked = false;
                    await loadAndDecryptEntries();

                    const upgradedKey = await upgradeKdfIfNeeded(password, saltBytes, kdf);
                    if (upgradedKey) {
                        masterKey = upgradedKey;
                        showToast(`Re-encrypted at ${PBKDF2_ITERATIONS.toLocaleString()} KDF iterations.`);
                    }

                    startIdleWatch();
                    renderApp();
                } else {
                    setAuthFormBusy('unlock-submit', false);
                    errorEl.textContent = 'Invalid master password.';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                console.error('Decryption failed:', err);
                setAuthFormBusy('unlock-submit', false);
                errorEl.textContent = 'Invalid master password.';
                errorEl.classList.remove('hidden');
            }
        };

        // Lock Action
        window.lockVault = function(reason) {
            clearPwRevealTimers();
            stopIdleWatch();
            closeModal();
            closePalette();
            masterKey = null;
            isLocked = true;
            entries = [];
            expandedId = null;
            editingId = null;
            isCreating = false;
            deleteConfirmId = null;

        // --- Password strength estimate ---
        // A charset-entropy model with penalties. It is a rough guide, not a real

        const COMMON_PASSWORDS = new Set([

        // word + digits ("summer2024", "Dragon99") is the most common human pattern
        // and dies to any wordlist rule, so a charset count badly overrates it.
        const COMMON_BASE_WORDS = new Set([
            'summer', 'winter', 'spring', 'autumn', 'january', 'february', 'march', 'april', 'may', 'june',
            'july', 'august', 'september', 'october', 'november', 'december', 'hello', 'test', 'vault',

            'cookie', 'pepper', 'charlie', 'jordan', 'michael', 'jennifer', 'daniel', 'jessica', 'ashley',
            'nicole', 'hunter', 'ranger', 'buster', 'thomas', 'robert', 'matthew', 'andrew', 'joshua',
            'amanda', 'welcome', 'admin', 'login', 'secret', 'letmein', 'qwerty', 'password', 'iloveyou',
            'money', 'love', 'happy', 'friend', 'family', 'hello123'
        ]);

        const STRENGTH_LEVELS = [
            { label: 'very weak', color: '#f85149' },
            { label: 'weak',      color: '#db6d28' },
            { label: 'fair',      color: '#d29922' },
            { label: 'good',      color: '#7bdb80' },
            { label: 'strong',    color: '#3fb950' }
        ];

        const KEYBOARD_RUNS = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm', 'abcdefghijklmnopqrstuvwxyz', '01234567890'];

        function charPoolSize(pw) {
            let pool = 0;
            if (/[a-z]/.test(pw)) pool += 26;
            if (/[A-Z]/.test(pw)) pool += 26;
            if (/[0-9]/.test(pw)) pool += 10;
            if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
            return pool || 1;
        }

        // Length of the shortest unit the string is a whole repetition of
        // ("abcabcabc" -> 3), so padding by repetition stops buying entropy.
        function effectiveLength(pw) {
            for (let unit = 1; unit <= pw.length / 2; unit++) {
                if (pw.length % unit !== 0) continue;
                const chunk = pw.slice(0, unit);
                if (chunk.repeat(pw.length / unit) === pw) return unit;
            }
            return pw.length;
        }

        function sequentialRunPenalty(pw) {
            const lower = pw.toLowerCase();
            let penalty = 0;
            KEYBOARD_RUNS.forEach(run => {
                const reversed = run.split('').reverse().join('');
                for (let len = 3; len <= Math.min(lower.length, run.length); len++) {
                    for (let i = 0; i + len <= run.length; i++) {
                        const slice = run.slice(i, i + len);
                        const back = reversed.slice(i, i + len);
                        if (lower.includes(slice) || lower.includes(back)) penalty = Math.max(penalty, len * 1.5);
                    }
                }
            });
            return penalty;
        }

        function estimatePasswordStrength(pw) {
            if (!pw) return { score: 0, bits: 0, label: 'empty', hint: '', color: STRENGTH_LEVELS[0].color };

            const lower = pw.toLowerCase();
            if (COMMON_PASSWORDS.has(lower)) {
                return { score: 0, bits: 4, label: 'very weak', color: STRENGTH_LEVELS[0].color, hint: 'This is on every cracking wordlist.' };
            }

            // A known word with digits/punctuation tacked on: a wordlist plus a
            // year rule finds this in seconds regardless of how long it looks.
            const base = lower.replace(/[0-9!@#$%^&*._\-]+$/, '');
            if (base.length >= 3 && base.length <= 12 && (COMMON_BASE_WORDS.has(base) || COMMON_PASSWORDS.has(base))) {
                return { score: 0, bits: 20, label: 'very weak', color: STRENGTH_LEVELS[0].color, hint: 'A dictionary word with digits on the end is the first thing cracked.' };
            }

            const pool = charPoolSize(pw);
            let bits = effectiveLength(pw) * Math.log2(pool);
            bits -= sequentialRunPenalty(pw);
            if (/^[0-9]+$/.test(pw)) bits *= 0.7;                       // digits-only reads as a date or PIN
            if (/^[a-z]+$/.test(pw) && pw.length < 12) bits *= 0.85;    // short all-lowercase is dictionary bait
            bits = Math.max(0, bits);

            let score;
            if (bits < 28) score = 0;
            else if (bits < 40) score = 1;
            else if (bits < 60) score = 2;
            else if (bits < 80) score = 3;
            else score = 4;

            const missing = [];
            if (!/[a-z]/.test(pw)) missing.push('lowercase');
            if (!/[A-Z]/.test(pw)) missing.push('uppercase');
            if (!/[0-9]/.test(pw)) missing.push('digits');
            if (!/[^a-zA-Z0-9]/.test(pw)) missing.push('symbols');

            let hint;
            if (score >= 3) hint = `~${Math.round(bits)} bits of entropy.`;
            else if (pw.length < 12) hint = `Length helps most — ~${Math.round(bits)} bits so far.`;
            else if (missing.length) hint = `Add ${missing.slice(0, 2).join(' or ')} — ~${Math.round(bits)} bits so far.`;
            else hint = `~${Math.round(bits)} bits of entropy.`;

            return { score, bits, label: STRENGTH_LEVELS[score].label, color: STRENGTH_LEVELS[score].color, hint };
        }

        // --- Password generator ---
        const GEN_SETS = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            digits: '0123456789',
            symbols: '!@#$%^&*()-_=+[]{}<>?,.:;'

        // Rejection sampling — `% max` on a raw 32-bit draw would bias the low end.
        function randomIndex(maxExclusive) {
            const limit = Math.floor(0x100000000 / maxExclusive) * maxExclusive;
            const buf = new Uint32Array(1);
            let value;
            do {
                crypto.getRandomValues(buf);
                value = buf[0];
            } while (value >= limit);
            return value % maxExclusive;
        }

        function generatePassword(opts) {
            const active = Object.keys(GEN_SETS).filter(k => opts[k]);
            if (active.length === 0) return '';

            const sets = active.map(k => {
                const chars = opts.avoidAmbiguous
                    ? GEN_SETS[k].split('').filter(c => !AMBIGUOUS_CHARS.includes(c)).join('')
                    : GEN_SETS[k];
                return chars || GEN_SETS[k];
            });
            const pool = sets.join('');
            const length = Math.max(opts.length, sets.length);

            // One character from each selected set first, so a generated password
            // always satisfies the classes the user asked for.
            const chars = sets.map(set => set[randomIndex(set.length)]);
            while (chars.length < length) chars.push(pool[randomIndex(pool.length)]);

            for (let i = chars.length - 1; i > 0; i--) {
                const j = randomIndex(i + 1);
                [chars[i], chars[j]] = [chars[j], chars[i]];
            }
            return chars.join('');
        }

                        <select id="set-autolock" class="w-full bg-[#0d1117] border border-grid text-on-surface text-mono-ui-sm font-mono-ui-sm rounded px-sm py-xs focus:border-primary focus:outline-none">
                            ${options.map(o => `<option value="${o.value}" ${s.autoLockMinutes === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
                        </select>
                        <div class="text-sans-label font-sans-label text-on-surface-variant/70 mt-xs">You get a ${IDLE_WARNING_SECONDS}-second warning before the vault locks itself.</div>
                    </div>
                    <div>
                        <label for="set-rotation" class="block text-sans-label font-sans-label text-on-surface-variant uppercase mb-xs">Default rotation period for new entries</label>
                        <select id="set-rotation" class="w-full bg-[#0d1117] border border-grid text-on-surface text-mono-ui-sm font-mono-ui-sm rounded px-sm py-xs focus:border-primary focus:outline-none">
                            ${ROTATION_OPTIONS.map(o => `<option value="${o.value}" ${s.rotationDefaultDays === o.value ? 'selected' : ''}>${o.label}</option>`).join('')}
                        </select>
                    </div>
                    <div class="border-t border-grid pt-md text-sans-label font-sans-label text-on-surface-variant/70 flex flex-col gap-[3px]">
                        <div>Cipher: AES-GCM 256</div>
                        <div>Key derivation: PBKDF2-${kdf.hash}, ${kdf.iterations.toLocaleString()} iterations</div>
                        <div>Entries stored: ${entries.length}</div>
                    </div>
                </div>`,
                onOpen: () => {
                    document.getElementById('set-autolock').addEventListener('change', e => {
                        saveSettings({ autoLockMinutes: parseInt(e.target.value, 10) });
                        startIdleWatch();
                        showToast(parseInt(e.target.value, 10) > 0 ? 'Auto-lock updated.' : 'Auto-lock disabled.');
                    });
                    document.getElementById('set-rotation').addEventListener('change', e => {
                        saveSettings({ rotationDefaultDays: parseInt(e.target.value, 10) });
                        showToast('Default rotation period updated.');
                    });
                }
            });
        };

        // --- Rotation / staleness ---
        const DAY_MS = 86400000;
        const ROTATION_OPTIONS = [
            { value: 0, label: 'No reminder' },
            { value: 30, label: 'Every 30 days' },
            { value: 60, label: 'Every 60 days' },
            { value: 90, label: 'Every 90 days' },
            { value: 180, label: 'Every 180 days' },
            { value: 365, label: 'Every year' }
        ];

        function rotationBaseline(item) {
            return item.rotatedAt || item.createdAt || Date.now();
        }

        // 'overdue' once the period has elapsed, 'due-soon' inside the last 20%
        // of it (capped at a week so yearly policies do not nag for 2 months).
        function rotationStatus(item) {
            const days = Number(item.rotateDays) || 0;
            if (!days) return null;

            const elapsed = Date.now() - rotationBaseline(item);
            const period = days * DAY_MS;
            const remainingDays = Math.ceil((period - elapsed) / DAY_MS);

            if (elapsed >= period) {
                return { state: 'overdue', days: remainingDays, label: `overdue by ${Math.abs(remainingDays)}d`, color: 'text-error border-error/60' };
            }
            const soonWindow = Math.min(period * 0.2, 7 * DAY_MS);
            if (period - elapsed <= soonWindow) {
                return { state: 'due-soon', days: remainingDays, label: `rotate in ${remainingDays}d`, color: 'text-tertiary border-tertiary/60' };
            }
            return { state: 'ok', days: remainingDays, label: `rotate in ${remainingDays}d`, color: 'text-on-surface-variant border-grid' };
        }

        function needsRotation(item) {
            const status = rotationStatus(item);
            return !!status && (status.state === 'overdue' || status.state === 'due-soon');
        }

        function rotationBadge(item, compact) {
            const status = rotationStatus(item);
            if (!status) return '';
            if (compact && status.state === 'ok') return '';
            const icon = status.state === 'overdue' ? 'error' : (status.state === 'due-soon' ? 'schedule' : 'event_repeat');
            return `<span class="px-xs py-[2px] bg-[#21262d] border rounded text-sans-label font-sans-label inline-flex items-center gap-[3px] ${status.color}" title="Rotation policy: every ${item.rotateDays} days">
                <span class="material-symbols-outlined text-[12px] leading-none">${icon}</span>${status.label}
            </span>`;
        }

        window.markRotated = async function(id, event) {
            if (event) event.stopPropagation();
            const item = entries.find(e => e.id === id);
            if (!item) return;
            item.rotatedAt = Date.now();
            await saveEntries();
            renderApp();
            showToast(`Marked "${item.name}" as rotated.`);
        };

        // --- Encrypted backup export / import ---
        // The backup carries its own salt and iteration count, so it can be
        // restored on a machine that has none of this vault's localStorage.
        function passphraseFieldsMarkup(prefix, opts) {
            const o = opts || {};
            return `
            <div>
                <label for="${prefix}-pass" class="block text-sans-label font-sans-label text-on-surface-variant uppercase mb-xs">${o.label || 'Backup passphrase'}</label>
                <div class="relative">
                    <input id="${prefix}-pass" type="password" ${o.autocomplete || 'autocomplete="new-password"'} placeholder="${o.placeholder || 'Passphrase for this file...'}" class="w-full bg-[#0d1117] border border-grid text-on-surface text-mono-ui-sm font-mono-ui-sm rounded pl-sm pr-[72px] py-xs focus:border-primary focus:outline-none" />
                    <div class="absolute inset-y-0 right-0 flex items-center">
                        ${o.generator ? `
                        <button type="button" onclick="openGenerator('${prefix}-pass')" aria-label="Generate passphrase" title="Generate a passphrase" class="w-[36px] h-full flex items-center justify-center text-on-surface-variant hover:text-primary focus:text-primary focus:outline-none transition-colors">
                            <span class="material-symbols-outlined text-[18px]">casino</span>
                        </button>` : ''}
                        <button type="button" onclick="togglePasswordVisibility('${prefix}-pass', this)" aria-label="Show passphrase" aria-pressed="false" title="Show passphrase (hides again after ${PW_REVEAL_MS / 1000}s)" class="w-[36px] h-full flex items-center justify-center text-on-surface-variant hover:text-primary focus:text-primary focus:outline-none transition-colors">
                            <span class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>
                ${o.meter ? strengthMeterMarkup(prefix + '-strength') : ''}
            </div>`;
        }

        window.openExportModal = function() {
            if (!entries || entries.length === 0) {
                showToast('No entries to export.');
                return;
            }
            openModal({
                title: 'export backup',
                icon: 'download',
                body: `
                <div class="text-mono-ui-sm text-on-surface-variant leading-relaxed">
                    ${entries.length} entr${entries.length === 1 ? 'y' : 'ies'} will be encrypted with a passphrase of your choosing. The file carries its own salt, so you can restore it on any machine.
                </div>
                <form onsubmit="handleExportSubmit(event)" class="flex flex-col gap-md">
                    ${passphraseFieldsMarkup('exp', { generator: true, meter: true })}
                    ${passphraseFieldsMarkup('exp-confirm', { label: 'Confirm passphrase', placeholder: 'Repeat it...' })}
                    <label class="flex items-start gap-xs text-mono-ui-sm cursor-pointer select-none">
                        <input id="exp-plaintext" type="checkbox" class="w-4 h-4 mt-[2px] rounded bg-[#0d1117] border-grid text-error focus:ring-0 focus:ring-offset-0" onchange="togglePlaintextExport(this.checked)" />
                        <span class="text-on-surface-variant">Export unencrypted instead <span class="text-error">(every key in cleartext on disk)</span></span>
                    </label>
                    <div id="exp-error" class="text-error text-mono-ui-sm hidden"></div>
                    <div class="flex justify-end gap-sm">
                        <button type="button" onclick="closeModal()" class="btn-action px-md py-xs rounded text-mono-ui-sm min-h-[36px] flex items-center">Cancel</button>
                        <button id="exp-submit" type="submit" class="btn-action px-md py-xs rounded text-mono-ui-sm text-primary border-primary/50 hover:border-primary min-h-[36px] flex items-center gap-xs">
                            <span class="material-symbols-outlined text-[16px]">download</span>
                            <span class="btn-label">Encrypt &amp; download</span>
                        </button>
                    </div>
                </form>`,
                onOpen: () => {
                    wireStrengthMeter('exp-pass', 'exp-strength');
                    document.getElementById('exp-pass').focus();
                }
            });
        };

        window.togglePlaintextExport = function(plaintext) {
            ['exp-pass', 'exp-confirm-pass'].forEach(id => {
                const input = document.getElementById(id);
                if (!input) return;
                input.disabled = plaintext;
                input.closest('div').parentElement.classList.toggle('opacity-40', plaintext);
            });
            const label = document.querySelector('#exp-submit .btn-label');
            if (label) label.textContent = plaintext ? 'Download cleartext' : 'Encrypt & download';
        };

        function downloadJSON(obj, suffix) {
            const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vault_backup_${new Date().toISOString().split('T')[0]}${suffix}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        window.handleExportSubmit = async function(e) {
            e.preventDefault();
            const errorEl = document.getElementById('exp-error');
            const plaintext = document.getElementById('exp-plaintext').checked;

            if (plaintext) {
                downloadJSON({ app: 'Vault', version: EXPORT_FORMAT_VERSION, encrypted: false, exportedAt: new Date().toISOString(), entries }, '_CLEARTEXT');
                closeModal();
                showToast('Exported in cleartext — store it somewhere safe.');
                return;
            }

            const pass = document.getElementById('exp-pass').value;
            const confirm = document.getElementById('exp-confirm-pass').value;

            if (pass.length < MIN_MASTER_PASSWORD_LENGTH) {
                errorEl.textContent = `Passphrase must be at least ${MIN_MASTER_PASSWORD_LENGTH} characters long.`;
                errorEl.classList.remove('hidden');
                return;
            }
            if (pass !== confirm) {
                errorEl.textContent = 'Passphrases do not match.';
                errorEl.classList.remove('hidden');
                return;
            }

            errorEl.classList.add('hidden');
            setAuthFormBusy('exp-submit', true, 'Encrypting...');
            await nextPaint();

            try {
                const saltBytes = crypto.getRandomValues(new Uint8Array(16));
                const key = await deriveMasterKey(pass, saltBytes, PBKDF2_ITERATIONS, 'SHA-256');
                const payload = await encryptText(JSON.stringify(entries), key);
                downloadJSON({
                    app: 'Vault',
                    version: EXPORT_FORMAT_VERSION,
                    encrypted: true,
                    exportedAt: new Date().toISOString(),
                    entryCount: entries.length,
                    kdf: { name: 'PBKDF2', hash: 'SHA-256', iterations: PBKDF2_ITERATIONS, salt: bufferToBase64(saltBytes) },
                    cipher: { name: 'AES-GCM', iv: payload.iv, ciphertext: payload.ciphertext }
                }, '');
                closeModal();
                showToast(`Exported ${entries.length} encrypted entr${entries.length === 1 ? 'y' : 'ies'}.`);
            } catch (err) {
                console.error('Export failed:', err);
                setAuthFormBusy('exp-submit', false);
                errorEl.textContent = 'Failed to encrypt the backup.';
                errorEl.classList.remove('hidden');
            }
        };

        function mergeImportedEntries(importedEntries) {
            const existingIds = new Set(entries.map(item => item.id));
            let addedCount = 0;

            importedEntries.slice().reverse().forEach(item => {
                if (!item || !item.name || !item.type || !item.value) return;
                let id = item.id || ('entry-' + Date.now());
                if (existingIds.has(id)) {
                    id = 'entry-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
                }
                entries.unshift({
                    id,
                    name: item.name,
                    type: item.type,
                    value: item.value,
                    createdAt: item.createdAt || Date.now(),
                    lastUsedAt: item.lastUsedAt || null,
                    rotateDays: Number(item.rotateDays) || 0,
                    rotatedAt: item.rotatedAt || null
                });
                existingIds.add(id);
                addedCount++;
            });
            return addedCount;
        }

        async function finishImport(importedEntries) {
            if (!Array.isArray(importedEntries) || importedEntries.length === 0) {
                showToast('Backup contains no entries.');
                return;
            }
            const added = mergeImportedEntries(importedEntries);
            await saveEntries();
            renderApp();
            showToast(`Imported ${added} entr${added === 1 ? 'y' : 'ies'}.`);
        }

        function openImportPassphraseModal(payload) {
            openModal({
                title: 'import backup',
                icon: 'upload',
                body: `
                <div class="text-mono-ui-sm text-on-surface-variant leading-relaxed">
                    This backup is encrypted${payload.entryCount ? ` and holds ${payload.entryCount} entr${payload.entryCount === 1 ? 'y' : 'ies'}` : ''}. Enter the passphrase it was exported with.
                </div>
                <form onsubmit="handleImportDecrypt(event)" class="flex flex-col gap-md">
                    ${passphraseFieldsMarkup('imp', { label: 'Backup passphrase', placeholder: 'Passphrase for this file...', autocomplete: 'autocomplete="current-password"' })}
                    <div id="imp-error" class="text-error text-mono-ui-sm hidden"></div>
                    <div class="flex justify-end gap-sm">
                        <button type="button" onclick="closeModal()" class="btn-action px-md py-xs rounded text-mono-ui-sm min-h-[36px] flex items-center">Cancel</button>
                        <button id="imp-submit" type="submit" class="btn-action px-md py-xs rounded text-mono-ui-sm text-primary border-primary/50 hover:border-primary min-h-[36px] flex items-center gap-xs">
                            <span class="material-symbols-outlined text-[16px]">lock_open</span>
                            <span class="btn-label">Decrypt &amp; import</span>
                        </button>
                    </div>
                </form>`,
                onClose: () => { pendingImportPayload = null; },
                onOpen: () => document.getElementById('imp-pass').focus()
            });
        }

        let pendingImportPayload = null;

        window.handleImportDecrypt = async function(e) {
            e.preventDefault();
            const errorEl = document.getElementById('imp-error');
            const pass = document.getElementById('imp-pass').value;
            const payload = pendingImportPayload;
            if (!payload) return;

            errorEl.classList.add('hidden');
            setAuthFormBusy('imp-submit', true, 'Decrypting...');
            await nextPaint();

            try {
                const saltBytes = new Uint8Array(base64ToBuffer(payload.kdf.salt));
                const key = await deriveMasterKey(pass, saltBytes, payload.kdf.iterations, payload.kdf.hash || 'SHA-256');
                const jsonStr = await decryptText(payload.cipher.ciphertext, payload.cipher.iv, key);
                pendingImportPayload = null;
                closeModal();
                await finishImport(JSON.parse(jsonStr));
            } catch (err) {
                console.error('Backup decryption failed:', err);
                setAuthFormBusy('imp-submit', false);
                errorEl.textContent = 'Wrong passphrase, or the file is damaged.';
                errorEl.classList.remove('hidden');
            }
        };

        // --- Command palette ---
        let paletteItems = [];
        let paletteIndex = 0;

        function isPaletteOpen() {
            const root = document.getElementById('palette-root');
            return !!root && !root.classList.contains('hidden');
        }

        // Subsequence match, scored so that tighter and earlier hits rank first.
        function fuzzyScore(haystack, needle) {
            if (!needle) return 0;
            const h = haystack.toLowerCase();
            const n = needle.toLowerCase();
            let score = 0, hi = 0, streak = 0;
            for (let ni = 0; ni < n.length; ni++) {
                const found = h.indexOf(n[ni], hi);
                if (found === -1) return -1;
                streak = found === hi && ni > 0 ? streak + 1 : 0;
                score += streak * 4;
                if (found === 0 || /[^a-z0-9]/.test(h[found - 1])) score += 6;   // start of a word
                score -= Math.min(found - hi, 8);
                hi = found + 1;
            }
            return score - h.length * 0.05;
        }

        function paletteActions() {
            return [
                { icon: 'add', label: 'New entry', hint: 'n', run: () => toggleCreating(true) },
                { icon: 'casino', label: 'Generate password', hint: 'g', run: () => openGenerator(null) },
                { icon: 'download', label: 'Export encrypted backup', run: () => openExportModal() },
                { icon: 'upload', label: 'Import backup', run: () => triggerImportJSON() },
                { icon: 'settings', label: 'Settings', hint: ',', run: () => openSettings() },
                { icon: 'keyboard', label: 'Keyboard shortcuts', hint: '?', run: () => openShortcutsHelp() },
                { icon: 'folder', label: 'Filter: all entries', run: () => selectCategory('all') },
                { icon: 'key', label: 'Filter: api-keys', run: () => selectCategory('api-key') },
                { icon: 'description', label: 'Filter: prompts', run: () => selectCategory('prompt') },
                { icon: 'event_repeat', label: 'Filter: needs rotation', run: () => selectCategory('stale') },
                { icon: 'lock', label: 'Lock vault', hint: 'ctrl+L', run: () => lockVault() }
            ];
        }

        function buildPaletteItems(query) {
            const actions = paletteActions().map(a => ({
                kind: 'action', icon: a.icon, title: a.label, subtitle: 'Command', hint: a.hint || '', run: a.run,
                score: fuzzyScore(a.label, query)
            }));
            const items = entries.map(item => {
                const status = rotationStatus(item);
                return {
                    kind: 'entry', icon: item.type === 'api-key' ? 'key' : 'description',
                    title: item.name,
                    subtitle: `${item.type === 'api-key' ? 'API Key' : 'Prompt'} · ${formatTimeAgo(item.lastUsedAt)}${status && status.state === 'overdue' ? ' · rotation overdue' : ''}`,
                    hint: '', id: item.id,
                    score: fuzzyScore(item.name, query)
                };
            });
            return actions.concat(items)
                .filter(i => i.score >= 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 40);
        }

        function renderPaletteList() {
            const list = document.getElementById('palette-list');
            if (!list) return;
            if (paletteItems.length === 0) {
                list.innerHTML = '<div class="px-md py-md text-mono-ui-sm text-on-surface-variant">No matches.</div>';
                return;
            }
            list.innerHTML = paletteItems.map((item, i) => `
                <button type="button" data-palette-index="${i}" class="w-full flex items-center gap-sm px-md py-xs text-left border-l-2 ${i === paletteIndex ? 'border-primary bg-[#1c2430]' : 'border-transparent hover:bg-[#161b22]'}">
                    <span class="material-symbols-outlined text-[18px] ${i === paletteIndex ? 'text-primary' : 'text-on-surface-variant'} shrink-0">${item.icon}</span>
                    <span class="flex-1 min-w-0">
                        <span class="block text-mono-ui-sm font-mono-ui-sm ${i === paletteIndex ? 'text-primary' : 'text-on-surface'} truncate">${escapeHtml(item.title)}</span>
                        <span class="block text-sans-label font-sans-label text-on-surface-variant/70 truncate">${escapeHtml(item.subtitle)}</span>
                    </span>
                    ${item.hint ? `<kbd class="shrink-0 px-xs py-[1px] bg-[#21262d] border border-grid rounded text-sans-label font-sans-label text-on-surface-variant">${escapeHtml(item.hint)}</kbd>` : ''}
                </button>`).join('');

            const active = list.querySelector(`[data-palette-index="${paletteIndex}"]`);
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function refreshPalette(query) {
            paletteItems = buildPaletteItems(query);
            paletteIndex = 0;
            renderPaletteList();
        }

        window.openPalette = function() {
            if (isLocked) return;
            closeModal();
            const root = document.getElementById('palette-root');
            root.innerHTML = `
            <div class="absolute inset-0 bg-black/70" onclick="closePalette()"></div>
            <div role="dialog" aria-modal="true" aria-label="Command palette" class="relative w-full max-w-xl bg-[#161b22] border border-grid rounded shadow-2xl overflow-hidden flex flex-col max-h-[70vh]">
                <div class="flex items-center gap-xs px-md py-sm border-b border-grid">
                    <span class="text-primary font-bold text-mono-ui-md">&gt;</span>
                    <input id="palette-input" type="text" autocomplete="off" spellcheck="false" placeholder="Run a command or jump to an entry..." class="flex-1 bg-transparent border-none outline-none text-on-surface text-mono-ui-md font-mono-ui-md focus:ring-0 p-0 placeholder:text-on-surface-variant/40" />
                </div>
                <div id="palette-list" class="overflow-y-auto py-xs"></div>
                <div class="flex items-center gap-md px-md py-xs border-t border-grid text-sans-label font-sans-label text-on-surface-variant/70">
                    <span>&uarr;&darr; navigate</span><span>&crarr; copy / run</span><span>&#8679;&crarr; open entry</span><span>esc close</span>
                </div>
            </div>`;
            root.classList.remove('hidden');

            const input = document.getElementById('palette-input');
            input.addEventListener('input', e => refreshPalette(e.target.value));
            input.addEventListener('keydown', handlePaletteKeydown);
            document.getElementById('palette-list').addEventListener('click', e => {
                const btn = e.target.closest('[data-palette-index]');
                if (!btn) return;
                paletteIndex = parseInt(btn.dataset.paletteIndex, 10);
                runPaletteSelection(false);
            });
            refreshPalette('');
            input.focus();
        };

        window.closePalette = function() {
            const root = document.getElementById('palette-root');
            if (!root || root.classList.contains('hidden')) return;
            root.classList.add('hidden');
            root.innerHTML = '';
            paletteItems = [];
        };

        function handlePaletteKeydown(e) {
            if (e.key === 'ArrowDown' || (e.key === 'n' && e.ctrlKey)) {
                e.preventDefault();
                paletteIndex = Math.min(paletteIndex + 1, paletteItems.length - 1);
                renderPaletteList();
            } else if (e.key === 'ArrowUp' || (e.key === 'p' && e.ctrlKey)) {
                e.preventDefault();
                paletteIndex = Math.max(paletteIndex - 1, 0);
                renderPaletteList();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                runPaletteSelection(e.shiftKey);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                closePalette();
            }
        }

        function runPaletteSelection(openInstead) {
            const item = paletteItems[paletteIndex];
            if (!item) return;
            closePalette();
            if (item.kind === 'action') {
                item.run();
            } else if (openInstead) {
                expandedId = item.id;
                activeCategory = 'all';
                searchQuery = '';
                const search = document.getElementById('search-input');
                if (search) search.value = '';
                renderApp();
            } else {
                copyToClipboard(item.id);
            }
        }

        // --- Keyboard shortcuts ---
        const SHORTCUTS = [
            { keys: ['ctrl', 'K'], label: 'Open the command palette' },
            { keys: ['/'], label: 'Jump to search' },
            { keys: ['N'], label: 'New entry' },
            { keys: ['G'], label: 'Generate a password' },
            { keys: ['ctrl', 'L'], label: 'Lock the vault' },
            { keys: [','], label: 'Open settings' },
            { keys: ['?'], label: 'Show this list' },
            { keys: ['esc'], label: 'Close, cancel, or clear search' }
        ];

        window.openShortcutsHelp = function() {
            openModal({
                title: 'keyboard shortcuts',
                icon: 'keyboard',
                body: `
                <div class="flex flex-col divide-y divide-[#30363d]">
                    ${SHORTCUTS.map(s => `
                    <div class="flex items-center justify-between gap-md py-xs">
                        <span class="text-mono-ui-sm text-on-surface-variant">${s.label}</span>
                        <span class="flex items-center gap-[3px] shrink-0">
                            ${s.keys.map(k => `<kbd class="px-xs py-[1px] bg-[#21262d] border border-grid rounded text-sans-label font-sans-label text-primary">${k}</kbd>`).join('<span class="text-on-surface-variant/50">+</span>')}
                        </span>
                    </div>`).join('')}
                </div>
                <div class="text-sans-label font-sans-label text-on-surface-variant/70">Single-letter shortcuts are ignored while you are typing in a field.</div>`
            });
        };

        function isTypingTarget(el) {
            if (!el) return false;
            const tag = el.tagName;
            return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
        }

        function handleGlobalKeydown(e) {
            if (!e.key || e.isComposing) return;
            const mod = e.metaKey || e.ctrlKey;

            if (mod && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                isPaletteOpen() ? closePalette() : openPalette();
                return;
            }
            if (mod && e.key.toLowerCase() === 'l' && !isLocked) {
                e.preventDefault();
                lockVault();
                return;
            }
            if (isPaletteOpen()) return;   // the palette input owns its own keys

            if (e.key === 'Escape') {
                if (isModalOpen()) { closeModal(); return; }
                if (isLocked) return;
                if (editingId) { cancelEdit(); return; }
                if (isCreating) { toggleCreating(false); return; }
                if (expandedId) { expandedId = null; renderApp(); return; }
                if (searchQuery) {
                    searchQuery = '';
                    const search = document.getElementById('search-input');
                    if (search) { search.value = ''; search.blur(); }
                    renderApp();
                    return;
                }
                if (isTypingTarget(document.activeElement)) document.activeElement.blur();
                return;
            }

            if (mod || e.altKey || isTypingTarget(e.target) || isLocked || isModalOpen()) return;

            if (e.key === '/') {
                e.preventDefault();
                const search = document.getElementById('search-input');
                if (search) { search.focus(); search.select(); }
            } else if (e.key === 'n') {
                e.preventDefault();
                toggleCreating(true);
            } else if (e.key === 'g') {
                e.preventDefault();
                openGenerator(null);
            } else if (e.key === ',') {
                e.preventDefault();
                openSettings();
            } else if (e.key === '?') {
                e.preventDefault();
                openShortcutsHelp();
            }
        }

        // --- Standard UI Rendering Helpers ---
        function formatTimeAgo(timestamp) {
            if (!timestamp) return 'never';
            const diff = Date.now() - timestamp;
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return 'just now';
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            const days = Math.floor(hours / 24);
            return `${days} day${days > 1 ? 's' : ''} ago`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function maskValue(val) {
            if (!val) return '••••••••••••••••••••••••';
            if (val.startsWith('sk-ant-')) return 'sk-ant-••••••••••••••••••••••••••••••••';
            if (val.startsWith('sk-proj-')) return 'sk-proj-••••••••••••••••••••••••••••••••';
            if (val.startsWith('sk-')) return 'sk-••••••••••••••••••••••••••••••••';
            return '••••••••••••••••••••••••••••••••';
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-[#21262d] border border-primary text-primary px-md py-xs rounded font-mono-ui-sm text-mono-ui-sm shadow-lg z-50 transition-opacity duration-300';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        // Import entries from JSON file (encrypted v2 backups and legacy plaintext)
        window.importVaultJSON = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const content = JSON.parse(e.target.result);

                    if (content && content.encrypted && content.kdf && content.cipher) {
                        pendingImportPayload = content;
                        openImportPassphraseModal(content);
                        return;
                    }

                    let importedEntries = null;
                    if (Array.isArray(content)) importedEntries = content;
                    else if (content && Array.isArray(content.entries)) importedEntries = content.entries;

                    if (!importedEntries) {
                        showToast('Invalid Vault JSON format.');
                        return;
                    }

                    await finishImport(importedEntries);
                    showToast('That backup was unencrypted — consider re-exporting it.');
                } catch (err) {
                    console.error('Import error:', err);
                    showToast('Failed to parse JSON file.');
                }
            };
            reader.onloadend = function() { event.target.value = ''; };
            reader.readAsText(file);
        };

            if (event) event.stopPropagation();
            const item = entries.find(e => e.id === id);
            if (!item) return;

            navigator.clipboard.writeText(item.value).then(() => {
                item.lastUsedAt = Date.now();
                saveEntries();
                renderApp();
                showToast('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy', err);
            });
        };

        window.saveEdit = async function(e, id) {
            e.preventDefault();
            const name = document.getElementById(`edit-name-${id}`).value.trim();
            const type = document.getElementById(`edit-type-${id}`).value;
            const value = document.getElementById(`edit-value-${id}`).value;
            const rotateDays = parseInt(document.getElementById(`edit-rotate-${id}`).value, 10) || 0;

            if (!name || !value) return;

            const index = entries.findIndex(item => item.id === id);
            if (index !== -1) {
                const valueChanged = entries[index].value !== value;
                entries[index].name = name;
                entries[index].type = type;
                entries[index].value = value;
                entries[index].rotateDays = rotateDays;
                // Replacing the secret is the rotation, so restart the clock.
                if (valueChanged || !entries[index].rotatedAt) entries[index].rotatedAt = Date.now();
                await saveEntries();
                if (valueChanged && rotateDays) showToast('Rotation clock reset.');
            }

            editingId = null;
            renderApp();
        };

                        </div>
                        <div class="pl-0 sm:pl-8 pr-0 sm:pr-md pb-xs pt-xs w-full">
                            <div class="relative bg-[#0d1117] border border-grid rounded p-md">
                                <div class="flex flex-wrap items-center justify-end gap-xs mb-sm sm:mb-0 sm:absolute sm:top-2 sm:right-2 z-10">
                                    <button onclick="toggleReveal('${item.id}', event)" class="btn-action min-h-[44px] sm:min-h-[28px] sm:h-6 px-sm rounded text-sans-label font-sans-label flex items-center gap-xs">
                                        <span class="material-symbols-outlined text-[14px]">${revealedState[item.id] ? 'visibility_off' : 'visibility'}</span>
                                        <span>${revealedState[item.id] ? 'Hide' : 'Reveal'}</span>
                                    </button>
                                    <button onclick="copyToClipboard('${item.id}', event)" class="btn-action min-h-[44px] sm:min-h-[28px] sm:h-6 px-sm rounded text-sans-label font-sans-label flex items-center gap-xs">
                                        <span class="material-symbols-outlined text-[14px]">content_copy</span>
                                        <span class="copy-text">Copy</span>
                                    </button>
                                    <button onclick="startEdit('${item.id}', event)" class="btn-action min-h-[44px] sm:min-h-[28px] sm:h-6 px-sm rounded text-sans-label font-sans-label flex items-center gap-xs">
                                        <span class="material-symbols-outlined text-[14px]">edit</span>
                                        <span>Edit</span>
                                    </button>
                                    ${item.rotateDays ? `
                                    <button onclick="markRotated('${item.id}', event)" class="btn-action min-h-[44px] sm:min-h-[28px] sm:h-6 px-sm rounded text-sans-label font-sans-label flex items-center gap-xs" title="Reset the rotation clock without changing the value">
                                        <span class="material-symbols-outlined text-[14px]">event_available</span>
                                        <span>Rotated</span>
                                    </button>` : ''}
                                    <button onclick="confirmDelete('${item.id}', event)" class="btn-action min-h-[44px] sm:min-h-[28px] sm:h-6 px-sm rounded text-sans-label font-sans-label flex items-center gap-xs ${isDeleting ? 'text-error border-error' : 'hover:text-error'}">
                                        <span class="material-symbols-outlined text-[14px]">delete</span>
                                        <span>${isDeleting ? 'Confirm?' : 'Delete'}</span>
                                    </button>
                                </div>
                                <pre class="text-mono-code font-mono-code text-on-surface-variant whitespace-pre-wrap break-all sm:pr-48 m-0 leading-relaxed">${revealedState[item.id] ? escapeHtml(item.value) : maskValue(item.value)}</pre>
                            </div>
                            <div class="flex flex-wrap gap-sm mt-sm">
                                <span class="px-xs py-[2px] bg-[#21262d] border border-grid rounded text-sans-label font-sans-label text-on-surface-variant uppercase">${item.type === 'api-key' ? 'API Key' : 'Prompt'}</span>
                                <span class="px-xs py-[2px] bg-[#21262d] border border-grid rounded text-sans-label font-sans-label text-on-surface-variant opacity-75">Created ${new Date(item.createdAt).toLocaleDateString()}</span>
                                ${rotationBadge(item, false)}
                            </div>
                        </div>
                    </div>
                    `;
                } else {
                    html += `
                    <div class="list-row flex flex-col sm:flex-row sm:items-center w-full min-h-[44px] py-xs sm:py-0 px-md group transition-colors duration-100 cursor-pointer border-b border-grid gap-xs sm:gap-0" onclick="toggleExpand('${item.id}')">
                        <div class="flex items-center flex-1 min-w-0">
                            <div class="w-8 flex items-center justify-center shrink-0">
                                <div class="w-1.5 h-1.5 rounded-full ${item.type === 'api-key' ? 'bg-primary' : 'bg-secondary'}"></div>
                            </div>
                            <div class="flex-1 flex items-center gap-sm min-w-0 pr-md">
                                <span class="text-mono-ui-sm font-mono-ui-sm text-on-surface truncate">${escapeHtml(item.name)}</span>
                                ${rotationBadge(item, true)}
                            </div>
                        </div>
                        <div class="flex items-center justify-between sm:justify-end gap-md pl-8 sm:pl-0">
                            <div class="text-mono-ui-sm font-mono-ui-sm text-on-surface-variant opacity-60 shrink-0 text-right sm:w-48">
                                ${formatTimeAgo(item.lastUsedAt)}
                            </div>
                            <div class="flex items-center gap-xs opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation()">
                                <button onclick="copyToClipboard('${item.id}', event)" class="text-on-surface-variant hover:text-primary min-w-[44px] min-h-[44px] flex items-center justify-center" title="Copy to clipboard">
                                    <span class="material-symbols-outlined text-[18px]">content_copy</span>
                                </button>
                                <button onclick="startEdit('${item.id}', event)" class="text-on-surface-variant hover:text-primary min-w-[44px] min-h-[44px] flex items-center justify-center" title="Edit entry">
                                    <span class="material-symbols-outlined text-[18px]">edit</span>
                                </button>
                                <button onclick="confirmDelete('${item.id}', event)" class="text-on-surface-variant ${isDeleting ? 'text-error' : 'hover:text-error'} min-w-[44px] min-h-[44px] flex items-center justify-center" title="${isDeleting ? 'Click to confirm delete' : 'Delete entry'}">
                                    <span class="material-symbols-outlined text-[18px]">${isDeleting ? 'help_outline' : 'delete'}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    `;
                }
            });

            container.innerHTML = html;
        }

        window.toggleCreating = function(show) {
            isCreating = typeof show === 'boolean' ? show : !isCreating;
            if (isCreating) {
                expandedId = null;
                editingId = null;
                deleteConfirmId = null;
            }
            renderApp();

            if (isCreating) {
                setTimeout(() => {
                    const input = document.getElementById('new-name');
                    if (input) input.focus();
                }, 50);
            }
        };

        window.handleCreate = async function(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value.trim();
            const type = document.getElementById('new-type').value;
            const value = document.getElementById('new-value').value;
            const rotateDays = parseInt(document.getElementById('new-rotate').value, 10) || 0;

            if (!name || !value) return;

            const newItem = {
                id: 'entry-' + Date.now(),
                name,
                type,
                value,
                createdAt: Date.now(),
                lastUsedAt: null,
                rotateDays,
                rotatedAt: Date.now()
            };

            entries.unshift(newItem);
            await saveEntries();

            isCreating = false;
            expandedId = newItem.id;
            renderApp();
        };

        // Main Render Controller
        function renderApp() {
            const authContainer = document.getElementById('auth-container');
            const appWorkspace = document.getElementById('app-workspace');
            const searchContainer = document.getElementById('search-container');
            const chromeButtons = ['btn-lock', 'btn-new-entry', 'btn-settings', 'btn-help'];

            if (!isInitialized || isLocked) {
                renderAuthScreens();
            } else {
                // Drop the auth markup so the typed master password (and any
                // pending reveal timer) does not linger in the DOM once unlocked.
                clearPwRevealTimers();
                authContainer.innerHTML = '';
                authContainer.classList.add('hidden');
                appWorkspace.classList.remove('hidden');
                searchContainer.classList.remove('hidden');
                chromeButtons.forEach(id => document.getElementById(id).classList.remove('hidden'));

                renderNav();
                renderEntries();
            }
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            checkInitialization();
            renderApp();

            document.getElementById('btn-new-entry').addEventListener('click', () => {
                toggleCreating();
            });

            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderApp();
            });

            document.addEventListener('keydown', handleGlobalKeydown);
        });
    </script>
</body>

</html>
